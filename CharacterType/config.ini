; ========================================================
; CharacterType 마우스 흔들림 및 스마트 전환 설정 파일
; ========================================================
[MouseSettings]
MaxRangeX=16.0       ; 가로 최대 이동 반경(px) - 작을수록 덜 흔들림
MaxRangeY=10.0       ; 세로 최대 이동 반경(px) - 작을수록 덜 흔들림
Smoothing=0.20      ; 움직임 부드러움 (0.05: 아주 부드러움 ~ 0.5: 빠름)
AutoSwitchDelay=2.0 ; 마우스 멈췄을 때 키보드 모드로 복귀하는 시간(초)
ReTriggerMs=35          ; 연속 타건 시 손을 살짝 들었다 치는 순간 반동 시간(ms, 25~45)
